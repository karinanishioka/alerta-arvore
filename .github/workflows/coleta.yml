name: Coleta diária

on:
  schedule:
    # 10h15 e 18h15 em São Paulo (UTC-3), de segunda a sábado
    - cron: "15 13,21 * * 1-6"
  workflow_dispatch:
    inputs:
      desde:
        description: "Reprocessar a partir de (AAAA-MM-DD), opcional"
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r coletor/requirements.txt
      - name: Testes do extrator
        run: python -m pytest -q coletor/testes
      - name: Coletar e extrair
        # se o Diário estiver fora do ar ou bloquear o acesso, o site é publicado com os dados que já existem
        continue-on-error: true
        run: python coletor/main.py ${{ inputs.desde && format('--desde {0}', inputs.desde) || '' }}
      - name: Salvar dados novos no repositório
        run: |
          git config user.name "alerta-arvore-bot"
          git config user.email "bot@users.noreply.github.com"
          git add site/dados site/feed.xml coletor/brutos
          git add coletor/cache_geocodificacao.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Dados atualizados $(date -u +%F)"
          # traz alterações feitas enquanto o robô rodava (ex.: um arquivo editado no site do GitHub)
          git pull --rebase -X theirs origin main
          git push
      - name: Montar o site
        run: python site/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: coletar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
